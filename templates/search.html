{% extends "base.html" %}
{% block content %}

<div class="page-container">

    <h2 class="page-title">Search Notes</h2>

    <div class="mini-card shadow-sm p-4 mb-4">
        <form method="POST" class="d-flex gap-2">
            <input type="text" name="query" class="form-control" placeholder="Search notes..." required>
            <button class="btn btn-primary">Search</button>
        </form>
    </div>

    {% if results %}
    <h4 class="fw-bold text-primary text-center mb-3">Results</h4>

    <div class="row g-4">

        {% for r in results %}
        <div class="col-sm-6 col-md-4 col-lg-3 d-flex">

            <div class="note-mini-card shadow-sm p-3 w-100 h-100 d-flex flex-column">

                <h5 class="fw-bold text-primary">{{ r.title }}</h5>

                <p class="text-muted small flex-grow-1 mt-2">{{ r.content[:130] }}...</p>

                <a href="/viewnote/{{ r.id }}" class="btn btn-outline-primary btn-sm mt-2">Open</a>

            </div>

        </div>
        {% endfor %}

    </div>
    {% endif %}

</div>

{% endblock %}
