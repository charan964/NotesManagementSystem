{% extends "base.html" %}
{% block content %}

<div class="container mt-5">
    <div class="card shadow-lg p-4">

        <h2 class="fw-bold text-primary">{{ note.title }}</h2>
        <p class="mt-3">{{ note.content }}</p>

        <div class="mt-4">
            <a href="/updatenote/{{ note.id }}" class="btn btn-warning">Edit</a>
            <a href="/deletenote/{{ note.id }}" class="btn btn-danger"
               onclick="return confirm('Are you sure you want to delete this note?')">Delete</a>
            <a href="/viewall" class="btn btn-secondary">Back</a>
        </div>

    </div>
</div>

{% endblock %}
