{% extends "base.html" %}
{% block content %}

<h2 class="page-title">{{ note.title }}</h2>

<div class="mini-card shadow-sm p-4">

    <p class="fs-5">{{ note.content }}</p>

    <p class="text-muted mt-2">
        Created: {{ note.created_at }}
    </p>

    <a href="/viewall" class="btn btn-secondary mt-3">⬅ Back to Notes</a>

</div>

{% endblock %}
