{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
    <div class="card shadow-lg p-4">

        <h2 class="fw-bold text-primary">{{ note.title }}</h2>
        <p class="mt-3">{{ note.content }}</p>

        <!-- Button Row -->
        <div class="d-flex mt-4 gap-2">

            <a href="/updatenote/{{ note.id }}" 
               class="btn btn-warning btn-sm px-4">Edit</a>

            <a href="/deletenote/{{ note.id }}" 
               class="btn btn-danger btn-sm px-4"
               onclick="return confirm('Are you sure you want to delete?');">
               Delete
            </a>

            <a href="/viewall" class="btn btn-secondary btn-sm px-4">
                Back
            </a>

        </div>

    </div>
</div>

{% endblock %}
