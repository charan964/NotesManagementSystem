<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta-name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title if title else "📝NotesApp" }}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="{% if request.path in ['/', '/login', '/register'] %}auth-fullscreen{% endif %}"
      style="font-family:'Inter', sans-serif;">


<!-- NAVBAR (TOP MENU WITH ALL LINKS) -->
<nav class="navbar navbar-expand-lg shadow-sm py-3 main-nav"
     style="background:#0d6efd !important;">
    <div class="container">

        <!-- Brand -->
        <a class="navbar-brand fw-bold fs-4 text-white" href="/">
            NotesApp
        </a>

        <!-- Mobile toggle -->
        <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainMenu">

            <ul class="navbar-nav ms-auto align-items-center">

                {% if session.get('user_id') %}

                <li class="nav-item">
                    <a class="nav-link text-white" href="/dashboard">Dashboard</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" href="/addnote">Add Note</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" href="/viewall">My Notes</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" href="/search">Search</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" href="/logout">Logout</a>
                </li>

                {% else %}

                <li class="nav-item">
                    <a class="nav-link text-white" href="/">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" href="/login">Login</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" href="/register">Register</a>
                </li>

                {% endif %}
                


                <!-- Theme Toggle -->
                <li class="nav-item ms-2">
                    <button id="themeToggle" class="btn btn-light">
                        <i class="fa fa-moon"></i>
                    </button>
                </li>

            </ul>

        </div>
    </div>
</nav>


<!-- MAIN CONTENT CENTER AREA -->
<div class="main-wrapper">
    {% block content %}{% endblock %}
</div>


<!-- FOOTER ALWAYS VISIBLE -->
<footer class="text-center py-3 text-white small fixed-bottom shadow-sm"
        style="background:#0d6efd !important;">
    © 2025 NotesApp — Professional SaaS Edition
</footer>


<!-- BOOTSTRAP -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- DARK MODE SCRIPT -->
<script>
const body = document.body;
const toggleBtn = document.getElementById("themeToggle");

if (toggleBtn) {
    if (localStorage.getItem("theme") === "dark") {
        body.classList.add("dark-mode");
        toggleBtn.innerHTML = '<i class="fa fa-sun"></i>';
    }

    toggleBtn.addEventListener("click", () => {
        body.classList.toggle("dark-mode");

        if (body.classList.contains("dark-mode")) {
            localStorage.setItem("theme", "dark");
            toggleBtn.innerHTML = '<i class="fa fa-sun"></i>';
        } else {
            localStorage.setItem("theme", "light");
            toggleBtn.innerHTML = '<i class="fa fa-moon"></i>';
        }
    });
}
</script>

</body>
</html>
