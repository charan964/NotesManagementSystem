{% extends "base.html" %}
{% block content %}

<div class="container page-top-space1">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-lg p-4">

                <h2 class="text-center fw-bold text-primary mb-3">Contact Us</h2>

                <p class="text-center text-muted">
                    Have any issues or suggestions? We're here to help!
                </p>

                <form>

                    <label class="fw-bold mt-3">Your Name</label>
                    <input type="text" class="form-control" placeholder="Enter your name" required>

                    <label class="fw-bold mt-3">Email</label>
                    <input type="email" class="form-control" placeholder="Enter your email" required>

                    <label class="fw-bold mt-3">Message</label>
                    <textarea rows="4" class="form-control" placeholder="Write your message..." required></textarea>

                    <div class="text-center mt-4">
                        <button class="btn btn-primary px-4">Send Message</button>
                    </div>

                </form>

            </div>

        </div>
    </div>
</div>

{% endblock %}
