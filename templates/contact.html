{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7">

        <div class="card shadow-sm border-0 p-4">
            <h2 class="fw-bold text-primary mb-3">Contact Us</h2>

            <p class="text-muted fs-5">Have questions or feedback? We'd love to hear from you.</p>

            <form>

                <label class="fw-semibold mt-2">Your Name</label>
                <input type="text" class="form-control" placeholder="Enter your name" required>

                <label class="fw-semibold mt-3">Your Email</label>
                <input type="email" class="form-control" placeholder="Enter your email" required>

                <label class="fw-semibold mt-3">Message</label>
                <textarea class="form-control" rows="5" placeholder="Your message..." required></textarea>

                <button class="btn btn-primary w-100 mt-4">Send</button>
            </form>
        </div>

    </div>
</div>

{% endblock %}
