{% extends "base.html" %}
{% block content %}

<h2 class="page-title">Welcome, {{ session.username }} 👋</h2>

<div class="row g-3 justify-content-center">

    <div class="col-6 col-md-3">
        <div class="dash-card shadow-sm text-center p-3">
            <i class="fa fa-plus dash-icon text-primary"></i>
            <h5 class="fw-semibold mt-2">Add Note</h5>
            <a href="/addnote" class="btn btn-primary btn-sm w-100 mt-2">Open</a>
        </div>
    </div>

    <div class="col-6 col-md-3">
        <div class="dash-card shadow-sm text-center p-3">
            <i class="fa fa-folder-open dash-icon text-primary"></i>
            <h5 class="fw-semibold mt-2">My Notes</h5>
            <a href="/viewall" class="btn btn-primary btn-sm w-100 mt-2">Open</a>
        </div>
    </div>

    <div class="col-6 col-md-3">
        <div class="dash-card shadow-sm text-center p-3">
            <i class="fa fa-search dash-icon text-primary"></i>
            <h5 class="fw-semibold mt-2">Search</h5>
            <a href="/search" class="btn btn-primary btn-sm w-100 mt-2">Open</a>
        </div>
    </div>

</div>

{% endblock %}
