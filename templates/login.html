{% extends "base.html" %}
{% block content %}

<!-- Centering Wrapper -->
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">

    <div class="card shadow-lg p-4" style="width: 380px; border-radius: 15px;">

        <h2 class="text-center fw-bold text-primary mb-4">Login</h2>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, msg in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show">
                {{ msg }}
                <button class="btn-close" data-bs-dismiss="alert"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">

            <label class="form-label fw-bold">Username</label>
            <input type="text" name="username" class="form-control mb-3" required>

            <label class="form-label fw-bold">Password</label>
            <input type="password" name="password" class="form-control mb-4" required>

            <button class="btn btn-primary w-100 py-2 fw-bold">
                Login
            </button>

        </form>

        <p class="text-center mt-3">
            Don't have an account?  
            <a href="/register" class="text-decoration-none fw-bold">Register</a>
        </p>

    </div>

</div>

{% endblock %}
