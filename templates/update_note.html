{% extends "base.html" %}
{% block content %}

<div class="container mt-5 d-flex justify-content-center">
    <div class="card shadow-lg p-4 border-0" style="width: 600px;">

        <h3 class="text-center fw-bold text-primary mb-3">Update Note</h3>

        <form method="POST">

            <label class="form-label fw-bold">Title</label>
            <input type="text" name="title" class="form-control"
                   value="{{ note.title }}" required>

            <label class="form-label fw-bold mt-3">Content</label>
            <textarea name="content" class="form-control" rows="6" required>{{ note.content }}</textarea>

            <div class="text-center mt-4">
                <button class="btn btn-primary px-4">Save Changes</button>
                <a href="/viewall" class="btn btn-secondary px-4">Cancel</a>
            </div>
        </form>

    </div>
</div>

{% endblock %}
