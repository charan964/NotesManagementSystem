{% extends "base.html" %}
{% block content %}

<div class="container d-flex justify-content-center mt-5 mb-5">
    <div class="card shadow-lg p-4" style="width: 450px;">

        <h3 class="text-center fw-bold text-primary mb-3">Forgot Password</h3>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, msg in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show">
                {{ msg }}
                <button class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST">

            <label class="form-label fw-bold">Enter Your Email</label>
            <input type="email" name="email" class="form-control" required>

            <button class="btn btn-primary w-100 mt-4">Send OTP</button>

        </form>

    </div>
</div>

{% endblock %}
