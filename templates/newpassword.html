{% extends "base.html" %}
{% block content %}

<h3 class="fw-bold mb-3">Set New Password</h3>

<div class="card">
    <div class="card-body">

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <button class="btn btn-success">Update Password</button>
        </form>

    </div>
</div>

{% endblock %}
