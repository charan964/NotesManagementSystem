{% extends "base.html" %}
{% block content %}

<div class="container mt-5" style="max-width:450px;">

    <h3 class="mb-3 fw-bold">Create Account</h3>

    <!-- FLASH MESSAGES -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- PHASE 1: USER ENTERS DETAILS -->
    {% if not otp_phase %}
    <form method="POST">
        <input type="hidden" name="send_otp" value="1">

        <div class="mb-3">
            <label>Username</label>
            <input name="username" required class="form-control">
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input name="email" type="email" required class="form-control">
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input name="password" type="password" required class="form-control">
        </div>

        <button class="btn btn-primary w-100">Send OTP</button>
    </form>

    {% else %}
    <!-- PHASE 2: ENTER OTP -->
    <form method="POST">
        <input type="hidden" name="verify_otp" value="1">

        <div class="mb-3">
            <label>Enter OTP sent to email</label>
            <input name="otp" required class="form-control">
        </div>

        <button class="btn btn-success w-100">Verify & Register</button>
    </form>

    {% endif %}

</div>

{% endblock %}
