{% extends "base.html" %}
{% block content %}

<div class="container d-flex justify-content-center mt-5 mb-5">
    <div class="card shadow-lg p-4" style="width: 450px;">

        <h2 class="text-center mb-4 fw-bold text-primary">Create Account</h2>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, msg in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show">
              {{ msg }}
              <button class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        {% endwith %}

        <form method="POST">

            <label class="form-label fw-bold">Username</label>
            <input type="text" name="username" class="form-control" required>

            <label class="form-label fw-bold mt-3">Email</label>
            <input type="email" name="email" class="form-control" required>

            <label class="form-label fw-bold mt-3">Password</label>
            <input type="password" name="password" class="form-control" required>

            <label class="form-label fw-bold mt-3">Confirm Password</label>
            <input type="password" name="confirm_password" class="form-control" required>

            <button class="btn btn-primary w-100 mt-4">Register</button>

            <p class="text-center mt-3">
                Already have an account?
                <a href="/login" class="text-primary fw-bold">Login</a>
            </p>

        </form>
    </div>
</div>

{% endblock %}
